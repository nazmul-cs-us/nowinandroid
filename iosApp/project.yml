# Xcode project definition, generated with XcodeGen (`xcodegen generate`).
#
# The .xcodeproj is generated rather than committed. A pbxproj is a large
# machine-written file that conflicts badly, and this repo already has two agents
# editing concurrently — a 30-line spec is reviewable, a pbxproj is not.
#
# Regenerate after changing this file:
#   cd iosApp && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: com.starception
  createIntermediateGroups: true
  deploymentTarget:
    # iOS 16.0. Compose Multiplatform itself supports 14+, but the product needs
    # ActivityKit for the prayer Live Update requires iOS 16.1.
    iOS: "16.1"

packages:
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.7

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
      - path: Shared
      - path: ../app/src/main/assets/manifest.json
        buildPhase: resources
        type: file
      # Reference the Android asset in place so the 6.8 MB database has one
      # source of truth while Xcode still copies it into the iOS app bundle.
      - path: ../app/src/main/assets/databases/quran.db
        buildPhase: resources
        type: file
      - path: ../app/src/main/assets/databases/news.db
        buildPhase: resources
        type: file
      # The Interests destination reads the same topic catalog and source
      # databases used by Android's NewsDbGenerator.
      - path: ../core/contentdatabase/src/main/assets/databases/topics.db
        buildPhase: resources
        type: file
      - path: ../app/src/main/assets/databases/quranic_duas.db
        buildPhase: resources
        type: file
      - path: ../app/src/main/assets/databases/fortress_of_the_muslim_v2.db
        buildPhase: resources
        type: file
      # Reuse Android's exact Interests/news artwork in place. Keeping these as
      # individual resources makes UIImage.imageNamed resolve the same basename
      # on iOS without maintaining a second copy of any asset.
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_holy_quran.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_sahih_bukhari.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_quranic_duas.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_morning_evening.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_prayer.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_home_daily.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_food_drink.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_travel.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_protection.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_distress_anxiety.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_health_sickness.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_social_etiquette.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_death_funeral.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_weather_nature.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_hajj_umrah.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_forgiveness_repentance.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_guidance_faith.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_remembrance_dhikr.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_family_marriage.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable-nodpi/topic_sacrifice_worship.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable/masjid_al_nawabi.png
        buildPhase: resources
        type: file
      - path: ../core/designsystem/src/main/res/drawable/masjid_al_haram.png
        buildPhase: resources
        type: file
      - path: ../app/src/main/res/drawable-nodpi/ic_flaticon_location_marker.png
        buildPhase: resources
        type: file
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Starception
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "1"
        # Required by Compose Multiplatform, which refuses to start without it:
        # PlistSanityCheck throws IllegalStateException on a background thread and
        # aborts the process. It lifts the 60 Hz cap so Compose can drive
        # ProMotion displays at their full refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
        NSSupportsLiveActivities: true
        # Empty by default. Set PRAYER_PUSH_BACKEND_URL externally to enable the
        # credential-free token snapshot uploader.
        PrayerPushBackendURL: $(PRAYER_PUSH_BACKEND_URL)
        # Core Location refuses to prompt without this string, and the refusal is
        # silent — no fix ever arrives and the app just shows the fallback city.
        NSLocationWhenInUseUsageDescription: >-
          Your location is used to calculate prayer times and Qibla direction.
          Coordinates are shared with Open-Meteo for local weather and with Apple
          to look up your place name and time zone. If you enable Travel Dua,
          location may also be used while the app is open to estimate driving.
        NSMicrophoneUsageDescription: >-
          The microphone is used only when you test voice recognition or answer a
          hands-free prompt.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition turns your test response into text so you can verify
          hands-free voice controls.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starception.submission
        # iPhone and iPad. Required for "Designed for iPad", which is how this
        # ships to Apple Silicon Macs — there is no separate Mac target.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # Device builds use automatic signing when DEVELOPMENT_TEAM is supplied
        # externally. Simulator builds remain unsigned and need no Apple account.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/iosApp.entitlements
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
        # The Gradle build phase writes into the build directory, which the
        # script sandbox otherwise blocks.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
      - target: PrayerLiveActivityExtension
        embed: true
    preBuildScripts:
      # Direct local integration: Gradle builds and embeds the framework as part
      # of the Xcode build, so the app can never link a stale copy. Copying a
      # prebuilt framework in by hand is the usual way that goes wrong.
      - name: Build Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  PrayerLiveActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayerLiveActivity
      - path: Shared
    info:
      path: PrayerLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Prayer Live Update
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starception.submission.PrayerLiveActivity
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"

  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starception.submission.UITests
        TEST_TARGET_NAME: iosApp
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
