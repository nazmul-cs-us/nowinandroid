# Daemon JVM criteria.
#
# Gradle cannot create test tasks when the daemon runs on JDK 24 -- ':app:
# testDemoDebugUnitTest' fails at configuration time with "Could not create an
# instance of type DefaultReportContainer > Type T not present". Assembling and
# installing are unaffected, so the breakage only shows up when someone tries to
# run the tests, and the message gives no hint that the JVM is the cause.
#
# Pinning the daemon to 21 makes `./gradlew test` work without callers having to
# know to set JAVA_HOME. Gradle auto-detects installed JDKs; if 21 is missing it
# reports that clearly instead of failing cryptically.
#
# This governs the JVM Gradle itself runs on, which is separate from the
# language level the project compiles to -- that stays at 17, set by
# NIA_JAVA_VERSION in build-logic.
toolchainVersion=21
