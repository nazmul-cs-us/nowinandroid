[versions]
accompanist = "0.37.0"
androidDesugarJdkLibs = "2.1.5"
# AGP and tools should be updated together
androidGradlePlugin = "8.13.0"
androidTools = "31.13.0"
androidxActivity = "1.9.3"
androidxAppCompat = "1.7.0"
androidxBrowser = "1.8.0"
androidxCredentials = "1.3.0"
googleid = "1.1.1"
androidxComposeBom = "2025.02.00"
# Compose Multiplatform, used only by :shared for the iOS UI. Deliberately not the
# newest (1.12.0): 1.9.x is contemporaneous with Kotlin 2.2.x, and the port plan
# calls for treating Kotlin/AGP/Compose upgrades as one tested toolchain change.
composeMultiplatform = "1.9.3"
# The multiplatform build of the same navigation library the Android app uses, so
# screens move between them without their navigation being rewritten. Only
# :shared depends on it; app keeps androidx.navigation.
composeNavigation = "2.9.2"
androidxComposeFoundation = "1.8.0-alpha07"
androidxComposeMaterial3 = "1.4.0"
androidxComposeMaterial3Adaptive = "1.1.0-rc01"
androidxComposeRuntimeTracing = "1.7.6"
androidxCore = "1.17.0-alpha01"
androidxCoreSplashscreen = "1.0.1"
androidxDataStore = "1.1.1"
androidxEspresso = "3.5.1"
# platform-samples builds its canonical widget layouts against 1.3.0-alpha02, but that
# requires compileSdk 37 and AGP 8.9.1 caps at 36 — taking it would mean an AGP upgrade
# across every module. 1.2.0-rc01 is the newest release that still compiles against 36;
# it carries the components the ported layouts need plus providePreview, and pins
# work-runtime at 2.7.1 so it cannot drag the app's WorkManager version around.
androidxGlance = "1.2.0-rc01"
androidxHiltNavigationCompose = "1.2.0"
androidxLifecycle = "2.7.0"
androidxLintGradle = "1.0.0"
androidxMacroBenchmark = "1.3.4"
androidxMetrics = "1.0.0-beta01"
