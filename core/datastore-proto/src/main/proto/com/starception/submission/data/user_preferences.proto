syntax = "proto3";

import "com/starception/submission/data/dark_theme_config.proto";
import "com/starception/submission/data/text_accent_color.proto";
import "com/starception/submission/data/theme_brand.proto";

option java_package = "com.starception.submission.core.datastore";
option java_multiple_files = true;

message UserPreferences {
    reserved 2;
    repeated int32 deprecated_int_followed_topic_ids = 1;
    int32 topicChangeListVersion = 3;
    int32 authorChangeListVersion = 4;
    int32 newsResourceChangeListVersion = 6;
    repeated int32 deprecated_int_followed_author_ids = 7;
    bool has_done_int_to_string_id_migration = 8;
    repeated string deprecated_followed_topic_ids = 9;
    repeated string deprecated_followed_author_ids = 10;
    repeated string deprecated_bookmarked_news_resource_ids = 11;
    bool has_done_list_to_map_migration = 12;

    // Each map is used to store a set of string IDs. The bool has no meaning, but proto3 doesn't
    // have a Set type so this is the closest we can get to a Set.
    map<string, bool> followed_topic_ids = 13;
    map<string, bool> followed_author_ids = 14;
    map<string, bool> bookmarked_news_resource_ids = 15;
    map<string, bool> viewed_news_resource_ids = 20;

    ThemeBrandProto theme_brand = 16;
    DarkThemeConfigProto dark_theme_config = 17;

    bool should_hide_onboarding = 18;

    bool use_dynamic_color = 19;

    // Stores the last opened timestamp (epoch millis) for each news resource
    map<string, int64> news_resource_last_opened_timestamps = 21;

    // Stores the user-defined order of topic IDs for the Interests page
    repeated string topic_order_ids = 22;

    TextAccentColorProto text_accent_color = 23;

    // ARGB int of the user-selected PRIMARY accent for ThemeBrand.CUSTOM.
    // Stored as fixed32 to preserve the alpha bits; 0 means "no custom colour set".
    fixed32 custom_theme_color = 24;

    // ARGB int of the user-selected SECONDARY accent for ThemeBrand.CUSTOM. 0 = unset.
    fixed32 custom_secondary_color = 25;

    // ARGB int of the user-selected TERTIARY accent for ThemeBrand.CUSTOM. 0 = unset.
    fixed32 custom_tertiary_color = 26;

    // NEXT AVAILABLE ID: 27
}
