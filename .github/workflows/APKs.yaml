name: APKs

# Builds installable APKs for every change and attaches them to the workflow
# run (downloadable from the run's Artifacts section — see the job summary
# for direct links).
#
#   - demo DEBUG APK:   always green, debug-signed
#   - demo RELEASE APK: R8-minified, resource-shrunk; signed with the release
#                       keystore when the KEYSTORE_* secrets are set
#                       (see scripts/setup_release_signing.sh), otherwise
#                       debug-signed. NOTE: this step stays red until the
#                       release packages are registered in Firebase and
#                       app/google-services.json is updated.
#
# Trigger: every push to main, every PR (preview APKs for testing), and
# manual dispatch.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apks:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing config (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are not set — the release APK will be debug-signed."
            echo "Run scripts/setup_release_signing.sh and add the GitHub secrets to enable release signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          cat > app/keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Collect build metadata
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDemoDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: app/build/outputs/apk/demo/debug/app-demo-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Built as a separate step so the debug APK above is still attached
      # when this fails (e.g. the release packages aren't registered in
      # Firebase yet — see the google-services.json note in the README
      # header of this workflow).
      - name: Build release APK
        run: ./gradlew :app:assembleDemoRelease -PskipBaselineProfile=true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-release
          path: app/build/outputs/apk/demo/release/app-demo-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## APK downloads"
            echo ""
            echo "Version \`$VERSION_NAME\` — commit \`$SHORT_SHA\`"
            echo ""
            echo "| Variant | Artifact |"
            echo "|---|---|"
            echo "| demo debug | [APK-debug](../../actions/runs/$GITHUB_RUN_ID/artifacts) (see Artifacts section) |"
            echo "| demo release | [APK-release](../../actions/runs/$GITHUB_RUN_ID/artifacts) (see Artifacts section) |"
          } >> "$GITHUB_STEP_SUMMARY"
