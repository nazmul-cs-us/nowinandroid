name: Release

# Builds signed release artifacts for both flavors and publishes them:
#   - APKs (GitHub Releases, for sideloading)
#   - AABs (Play Console upload)
#   - R8 mapping files (crash deobfuscation)
#
# Triggers:
#   - Push of a version tag (v*): creates a DRAFT GitHub release with artifacts
#   - Manual dispatch (any branch): builds and uploads workflow artifacts only
#
# Signing: requires repository secrets (see scripts/setup_release_signing.sh):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#
# Baseline profile generation is skipped (-PskipBaselineProfile) for speed and
# determinism; the committed app/src/main/baseline-prof.txt is still applied.
# NightlyBaselineProfiles.yaml refreshes the profile on main.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set."
            echo "Run scripts/setup_release_signing.sh locally, then add the GitHub secrets"
            echo "KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (see script header)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          cat > app/keystore.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APKs and AABs (both flavors)
        run: ./gradlew
              :app:assembleDemoRelease
              :app:assembleProdRelease
              :app:bundleDemoRelease
              :app:bundleProdRelease
              -PskipBaselineProfile=true

      - name: Collect artifacts
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p release-out
          cp app/build/outputs/apk/demo/release/app-demo-release.apk \
            "release-out/StarceptionSubmission-$VERSION_NAME-demo-release.apk"
          cp app/build/outputs/apk/prod/release/app-prod-release.apk \
            "release-out/StarceptionSubmission-$VERSION_NAME-prod-release.apk"
          cp app/build/outputs/bundle/demoRelease/app-demo-release.aab \
            "release-out/StarceptionSubmission-$VERSION_NAME-demo-release.aab"
          cp app/build/outputs/bundle/prodRelease/app-prod-release.aab \
            "release-out/StarceptionSubmission-$VERSION_NAME-prod-release.aab"
          cp app/build/outputs/mapping/demoRelease/mapping.txt \
            "release-out/mapping-$VERSION_NAME-demo.txt"
          cp app/build/outputs/mapping/prodRelease/mapping.txt \
            "release-out/mapping-$VERSION_NAME-prod.txt"
          ls -lh release-out

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-out/*
          if-no-files-found: error

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-out/*
