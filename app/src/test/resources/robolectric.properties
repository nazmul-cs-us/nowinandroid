# The app targets SDK 36, but Robolectric 4.14.1 ships shadows only up to 35 and
# refuses to run at all when targetSdkVersion exceeds what it supports
# ("targetSdkVersion=36 > maxSdkVersion=35"). Pinning the emulated SDK here keeps
# the Robolectric-backed tests runnable; drop this once Robolectric supports 36.
sdk=35
